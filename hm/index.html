    <!-- Consultation Modal -->
    <div id="consultationModal" class="modal-backdrop" aria-hidden="true" role="dialog">
        <div class="modal-card">
            <button id="modalCloseBtn" class="modal-close" aria-label="Close modal">&times;</button>

                <span class="form-badge"><i class="bi bi-shield-check"></i> <span data-i18n="form_guarantee"></span></span>

                <p data-i18n="modal_subtitle"></p>
            </div>
            <form id="modalForm" class="consultation-form">
                <div class="form-row">
                    <div class="form-field">
                        <label data-i18n="form_name"></label>
                        <input type="text" name="name" required placeholder="Ձեր Անունը / Ընկերությունը" data-i18n-ph="form_name" />
                    </div>
                    <div class="form-field">
                        <label data-i18n="form_phone"></label>
                        <input type="tel" name="phone" required placeholder="+374 (__) __-__-__" data-i18n-ph="form_phone" />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label data-i18n="form_email"></label>
                        <input type="email" name="email" placeholder="example@mail.com" data-i18n-ph="form_email" />
                    </div>
                    <div class="form-field">
                        <label data-i18n="form_service"></label>
                        <select name="service" required>
                            <option value="" disabled selected data-i18n="form_service"></option>
                            <option value="tax" data-i18n="form_service_tax"></option>
                            <option value="accounting" data-i18n="form_service_acc"></option>
                            <option value="audit" data-i18n="form_service_audit"></option>
                            <option value="financial_planning" data-i18n="form_service_fin"></option>
                        </select>
                    </div>
                </div>
                <div class="form-field">
                    <label data-i18n="form_message"></label>
                    <textarea name="message" rows="3" placeholder="Կարճ նկարագրեք Ձեր հարցը..." data-i18n-ph="form_message"></textarea>
                </div>
                <button type="submit" class="form-submit-btn">
                    <span class="btn-text" data-i18n="form_submit"></span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>
            <div id="modalSuccess" class="form-success-message" style="display: none;">

                <h3 data-i18n="form_success_title"></h3>

            </div>
